<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Bater Ponto</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            justify-content: center;
        }
        
        .container { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-sizing: border-box;
        }
        
        h2 { margin-top: 0; font-size: 1.4rem; }
        
        button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600; 
            transition: background 0.2s;
        }
        
        .btn-ponto { background-color: var(--success); color: white; }
        .btn-ponto:hover { background-color: var(--success-hover); }
        
        .btn-voltar { background-color: var(--primary); color: white; display: none; margin-bottom: 20px;}
        .btn-voltar:hover { background-color: #4338ca; }
        
        .btn-sair { background-color: var(--danger); color: white; margin-top: 20px; }
        .btn-sair:hover { background-color: var(--danger-hover); }
        
        .historico { margin-top: 20px; text-align: left; background: #f9fafb; padding: 10px; border-radius: 8px; border: 1px solid #e5e7eb;}
        .historico h4 { margin-top: 0; margin-bottom: 10px; color: var(--text-light); font-size: 12px; text-transform: uppercase;}
        
        .registro-item { 
            padding: 8px 0; 
            border-bottom: 1px solid #e5e7eb; 
            font-size: 13px; 
            display: flex;
            justify-content: space-between;
        }
        .registro-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="saudacao">Carregando...</h2>
    
    <!-- Botão exclusivo para Admin voltar para a tela de administração -->
    <button id="btn-voltar-admin" class="btn-voltar">Voltar ao Painel Admin</button>

    <h3>Registrar Ponto</h3>
    <button id="btn-entrada" class="btn-ponto">Entrada</button>
    <button id="btn-almoco-ida" class="btn-ponto">Ida Almoço</button>
    <button id="btn-almoco-volta" class="btn-ponto">Volta Almoço</button>
    <button id="btn-saida" class="btn-ponto">Saída</button>

    <div class="historico">
        <h4>Seus pontos de hoje:</h4>
        <div id="lista-pontos">Aguardando registros...</div>
    </div>

    <button id="btn-sair" class="btn-sair">Sair da Conta</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuração do Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCfkmIO8-XHvr49qmVZg2qUwKKGBIkNMcM",
        authDomain: "sistemaponto-f4263.firebaseapp.com",
        projectId: "sistemaponto-f4263",
        storageBucket: "sistemaponto-f4263.firebasestorage.app",
        messagingSenderId: "705613037858",
        appId: "1:705613037858:web:8c364ffcfb05074596257b",
        measurementId: "G-GRL6HE1KZM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioLogado = null;

    // Coordenadas globais da empresa e raio limite
    const EMPRESA_LAT = -27.34429378622745;
    const EMPRESA_LON = -51.61002715891619;
    const RAIO_MAXIMO_METROS = 50;

    // Verifica usuário logado e busca os dados
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            usuarioLogado = user;
            const docRef = doc(db, "usuarios", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const dados = docSnap.data();
                document.getElementById('saudacao').innerText = `Olá, ${dados.nome}`;
                
                // Exibe botão de voltar se for admin
                if (dados.tipo === 'admin') {
                    document.getElementById('btn-voltar-admin').style.display = 'block';
                }
                
                carregarRegistrosHoje();
            } else {
                alert("Erro: Usuário não encontrado no banco de dados.");
            }
        } else {
            window.location.href = "index.html";
        }
    });

    // Evento do botão Voltar (Admin)
    document.getElementById('btn-voltar-admin').addEventListener('click', () => {
        window.location.href = 'admin.html';
    });

    // Fórmula de Haversine para calcular distância em metros
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }

    // Função central para bater o ponto com validação de GPS
    async function baterPonto(tipoBatida) {
        alert("Verificando sua localização pelo GPS. Aguarde...");

        if (!navigator.geolocation) {
            alert("Erro: Seu navegador não suporta geolocalização. Ponto negado.");
            return;
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
            const latUsuario = position.coords.latitude;
            const lonUsuario = position.coords.longitude;
            
            // Calcula a distância exata da empresa
            const distancia = calcularDistancia(latUsuario, lonUsuario, EMPRESA_LAT, EMPRESA_LON);
            
            // BLOQUEIO DE DISTÂNCIA
            if (distancia > RAIO_MAXIMO_METROS) {
                alert(`PONTO NEGADO! Você está a ${Math.round(distancia)} metros da empresa. O limite máximo é de ${RAIO_MAXIMO_METROS} metros.`);
                return; 
            }

            // Gravação no Firebase se passar pelo bloqueio
            try {
                const dataHoraAtual = new Date().toISOString();
                
                await addDoc(collection(db, "registros"), {
                    uid: usuarioLogado.uid,
                    tipo_batida: tipoBatida,
                    data_hora: dataHoraAtual
                });

                alert(`Ponto registrado com sucesso! (${tipoBatida})`);
                carregarRegistrosHoje();
                
            } catch (error) {
                alert("Erro ao salvar no banco de dados: " + error.message);
            }

        }, (error) => {
            let msg = "Não foi possível verificar a localização.";
            if (error.code === 1) msg = "PONTO NEGADO: Permissão de GPS não concedida. Autorize o navegador a acessar sua localização.";
            else if (error.code === 2) msg = "Sinal de GPS indisponível no momento. Vá para uma área aberta.";
            else if (error.code === 3) msg = "Tempo limite para encontrar o GPS esgotado.";
            alert(msg);
        }, {
            enableHighAccuracy: true,
            timeout: 10000, 
            maximumAge: 0
        });
    }

    // Vincula os botões à função de bater ponto
    document.getElementById('btn-entrada').addEventListener('click', () => baterPonto('Entrada'));
    document.getElementById('btn-almoco-ida').addEventListener('click', () => baterPonto('Ida Almoço'));
    document.getElementById('btn-almoco-volta').addEventListener('click', () => baterPonto('Volta Almoço'));
    document.getElementById('btn-saida').addEventListener('click', () => baterPonto('Saída'));

    // Carrega o histórico do dia atual
    async function carregarRegistrosHoje() {
        if (!usuarioLogado) return;
        
        const hoje = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' }); // Pega a data no formato YYYY-MM-DD
        const inicioDia = hoje + "T00:00:00.000-03:00";
        const fimDia = hoje + "T23:59:59.999-03:00";

        const q = query(
            collection(db, "registros"),
            where("uid", "==", usuarioLogado.uid),
            where("data_hora", ">=", new Date(inicioDia).toISOString()),
            where("data_hora", "<=", new Date(fimDia).toISOString()),
            orderBy("data_hora", "asc")
        );

        const querySnapshot = await getDocs(q);
        const lista = document.getElementById('lista-pontos');
        lista.innerHTML = '';

        if (querySnapshot.empty) {
            lista.innerHTML = 'Nenhum ponto registrado hoje.';
            return;
        }

        querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const dataFormatada = new Date(data.data_hora).toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo' });
            lista.innerHTML += `<div class="registro-item"><strong>${data.tipo_batida}</strong> <span>${dataFormatada}</span></div>`;
        });
    }

    // Botão Sair
    document.getElementById('btn-sair').addEventListener('click', () => {
        signOut(auth).then(() => {
            window.location.href = "index.html";
        });
    });
</script>
</body>
</html>
