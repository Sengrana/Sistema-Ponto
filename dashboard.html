<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Bater Ponto</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-ponto { background-color: #28a745; color: white; }
        .btn-ponto:hover { background-color: #218838; }
        .btn-voltar { background-color: #007bff; color: white; display: none; }
        .btn-voltar:hover { background-color: #0056b3; }
        .btn-sair { background-color: #dc3545; color: white; margin-top: 20px; }
        .btn-sair:hover { background-color: #c82333; }
        .historico { margin-top: 20px; text-align: left; }
        .registro-item { padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="saudacao">Carregando...</h2>
    
    <!-- Botão exclusivo para Admin voltar -->
    <button id="btn-voltar-admin" class="btn-voltar">Voltar ao Painel Admin</button>

    <h3>Registrar Ponto</h3>
    <button id="btn-entrada" class="btn-ponto">Entrada</button>
    <button id="btn-almoco-ida" class="btn-ponto">Ida Almoço</button>
    <button id="btn-almoco-volta" class="btn-ponto">Volta Almoço</button>
    <button id="btn-saida" class="btn-ponto">Saída</button>

    <div class="historico">
        <h4>Seus pontos de hoje:</h4>
        <div id="lista-pontos">Aguardando registros...</div>
    </div>

    <button id="btn-sair" class="btn-sair">Sair da Conta</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // COLOQUE SUAS CHAVES DO FIREBASE AQUI
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_DOMINIO.firebaseapp.com",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_BUCKET",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioLogado = null;

    // Coordenadas exatas e raio permitido (50 metros)
    const EMPRESA_LAT = -27.34429378622745;
    const EMPRESA_LON = -51.61002715891619;
    const RAIO_MAXIMO_METROS = 50;

    // Verifica usuário logado e permissões
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            usuarioLogado = user;
            const docRef = doc(db, "usuarios", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const dados = docSnap.data();
                document.getElementById('saudacao').innerText = `Olá, ${dados.nome}`;
                
                // Se for admin, mostra o botão de voltar ao painel admin
                if (dados.tipo === 'admin') {
                    document.getElementById('btn-voltar-admin').style.display = 'block';
                }
                
                carregarRegistrosHoje();
            } else {
                alert("Erro: Usuário não encontrado no banco de dados.");
            }
        } else {
            window.location.href = "index.html";
        }
    });

    // Navegação do Admin
    document.getElementById('btn-voltar-admin').addEventListener('click', () => {
        window.location.href = 'admin.html';
    });

    // Função para calcular distância (Fórmula de Haversine)
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Raio da Terra em metros
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; // Distância em metros
    }

    // Função de Bater Ponto
    async function baterPonto(tipoBatida) {
        alert("Validando sua localização. Aguarde um momento...");

        if (!navigator.geolocation) {
            alert("Erro: Seu navegador não suporta geolocalização.");
            return;
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
            const latUsuario = position.coords.latitude;
            const lonUsuario = position.coords.longitude;
            
            const distancia = calcularDistancia(latUsuario, lonUsuario, EMPRESA_LAT, EMPRESA_LON);
            
            if (distancia > RAIO_MAXIMO_METROS) {
                alert(`Ponto negado! Você está a ${Math.round(distancia)} metros da empresa. O limite é ${RAIO_MAXIMO_METROS} metros.`);
                return; 
            }

            try {
                const dataHoraAtual = new Date().toISOString();
                
                await addDoc(collection(db, "registros"), {
                    uid: usuarioLogado.uid,
                    tipo_batida: tipoBatida,
                    data_hora: dataHoraAtual
                });

                alert(`Ponto registrado com sucesso! (${tipoBatida})`);
                carregarRegistrosHoje();
            } catch (error) {
                alert("Erro ao salvar no banco de dados: " + error.message);
            }

        }, (error) => {
            let msg = "Não foi possível verificar a localização.";
            if (error.code === 1) msg = "Permissão de GPS negada. Autorize no navegador para bater o ponto.";
            else if (error.code === 2) msg = "Sinal de GPS indisponível no momento.";
            else if (error.code === 3) msg = "Tempo limite para encontrar o GPS esgotado.";
            alert(msg);
        }, {
            enableHighAccuracy: true,
            timeout: 10000, 
            maximumAge: 0
        });
    }

    // Atribuindo eventos aos botões
    document.getElementById('btn-entrada').addEventListener('click', () => baterPonto('Entrada'));
    document.getElementById('btn-almoco-ida').addEventListener('click', () => baterPonto('Ida Almoço'));
    document.getElementById('btn-almoco-volta').addEventListener('click', () => baterPonto('Volta Almoço'));
    document.getElementById('btn-saida').addEventListener('click', () => baterPonto('Saída'));

    // Carregar histórico do dia
    async function carregarRegistrosHoje() {
        if (!usuarioLogado) return;
        
        const hoje = new Date().toISOString().split('T')[0]; // Pega a data YYYY-MM-DD
        const inicioDia = hoje + "T00:00:00.000Z";
        const fimDia = hoje + "T23:59:59.999Z";

        const q = query(
            collection(db, "registros"),
            where("uid", "==", usuarioLogado.uid),
            where("data_hora", ">=", inicioDia),
            where("data_hora", "<=", fimDia),
            orderBy("data_hora", "asc")
        );

        const querySnapshot = await getDocs(q);
        const lista = document.getElementById('lista-pontos');
        lista.innerHTML = '';

        if (querySnapshot.empty) {
            lista.innerHTML = 'Nenhum ponto registrado hoje.';
            return;
        }

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            const dataFormatada = new Date(data.data_hora).toLocaleTimeString('pt-BR');
            lista.innerHTML += `<div class="registro-item"><strong>${data.tipo_batida}</strong>: ${dataFormatada}</div>`;
        });
    }

    // Botão Sair
    document.getElementById('btn-sair').addEventListener('click', () => {
        signOut(auth).then(() => {
            window.location.href = "index.html";
        });
    });
</script>
</body>
</html>
