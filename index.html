<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Eletrônico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            transition: transform 0.3s ease;
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            background: var(--primary);
            color: white;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-entrada { background: var(--primary); }
        .btn-saida { background: var(--danger); }
        .btn-saida:hover { background: var(--danger-hover); }
        .btn-admin { background: var(--success); }
        .btn-admin:hover { background: var(--success-hover); }
        .btn-logout { background: #9ca3af; }
        .btn-logout:hover { background: #6b7280; }

        .hidden { display: none; }

        .resumo {
            font-size: 13px;
            color: var(--text-light);
            margin: 20px 0 15px 0;
            text-align: left;
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .chart-container {
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="card" id="login-box">
        <h2>Área de Acesso</h2>
        <input type="email" id="email" placeholder="Seu e-mail profissional" autocomplete="off">
        <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password">
        <button onclick="fazerLogin()">Entrar</button>
    </div>

    <div class="card hidden" id="ponto-box">
        <h2 id="bem-vindo"></h2>
        <button class="btn-entrada" onclick="baterPonto('Entrada')">Marcar Entrada</button>
        <button class="btn-saida" onclick="baterPonto('Saida')">Marcar Saída</button>
        
        <div class="resumo">
            <b>Resumo da Jornada:</b>
            <div id="status-horas-extras" style="margin-top: 4px;">Calculando...</div>
        </div>

        <div class="chart-container">
            <canvas id="graficoHoras"></canvas>
        </div>

        <button id="btn-admin" class="hidden btn-admin" onclick="window.location.href='admin.html'" style="margin-top: 15px;">Painel Administrador</button>
        <button class="btn-logout" onclick="fazerLogout()">Sair da Conta</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfkmIO8-XHvr49qmVZg2qUwKKGBIkNMcM",
            authDomain: "sistemaponto-f4263.firebaseapp.com",
            projectId: "sistemaponto-f4263",
            storageBucket: "sistemaponto-f4263.firebasestorage.app",
            messagingSenderId: "705613037858",
            appId: "1:705613037858:web:8c364ffcfb05074596257b",
            measurementId: "G-GRL6HE1KZM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let dadosUsuarioLogado = null;
        let meuGrafico = null;

        // Coordenadas da empresa e tolerância de 50 metros
        const EMPRESA_LAT = -27.34429378622745;
        const EMPRESA_LON = -51.61002715891619;
        const RAIO_MAXIMO_METROS = 50; 

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            var R = 6371000;
            var dLat = toRad(lat2 - lat1);
            var dLon = toRad(lon2 - lon1);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    dadosUsuarioLogado = docSnap.data();
                    document.getElementById('login-box').classList.add('hidden');
                    document.getElementById('ponto-box').classList.remove('hidden');
                    document.getElementById('bem-vindo').innerText = `Olá, ${dadosUsuarioLogado.nome}`;

                    const tipoUsuario = String(dadosUsuarioLogado.tipo).trim().toLowerCase();
                    if (tipoUsuario === 'admin') {
                        document.getElementById('btn-admin').classList.remove('hidden');
                    } else {
                        document.getElementById('btn-admin').classList.add('hidden');
                    }

                    calcularHorasExtras(user.uid);
                }
            }
        });

        window.fazerLogin = async function() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                await signInWithEmailAndPassword(auth, email, senha);
            } catch (error) {
                alert("Erro no login: E-mail ou senha incorretos.");
            }
        };

        window.fazerLogout = async function() {
            await signOut(auth);
            document.getElementById('ponto-box').classList.add('hidden');
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('senha').value = '';
        };

        window.baterPonto = async function(tipo) {
            if (!dadosUsuarioLogado) return;

            if (!navigator.geolocation) {
                alert("Seu navegador não suporta geolocalização.");
                return;
            }

            alert("Obtendo sua localização com alta precisão, aguarde...");

            navigator.geolocation.getCurrentPosition(async (position) => {
                const latUsuario = position.coords.latitude;
                const lonUsuario = position.coords.longitude;
                const precisaoGPS = position.coords.accuracy;

                const distancia = calcularDistancia(latUsuario, lonUsuario, EMPRESA_LAT, EMPRESA_LON);

                if (distancia > RAIO_MAXIMO_METROS) {
                    alert(`Ponto negado! Você está a aproximadamente ${Math.round(distancia)} metros da empresa. O limite máximo permitido é de ${RAIO_MAXIMO_METROS} metros.`);
                    return;
                }

                try {
                    await addDoc(collection(db, "registros"), {
                        uid: auth.currentUser.uid,
                        nome: dadosUsuarioLogado.nome,
                        email: dadosUsuarioLogado.email,
                        tipo_batida: tipo,
                        data_hora: new Date().toISOString(),
                        localizacao: { lat: latUsuario, lon: lonUsuario, precisao_metros: Math.round(precisaoGPS) }
                    });
                    alert(`Ponto de ${tipo} registrado com sucesso! (Distância: ${Math.round(distancia)}m da empresa)`);
                    calcularHorasExtras(auth.currentUser.uid);
                } catch (error) {
                    alert("Erro ao registrar ponto: " + error.message);
                }

            }, (error) => {
                let mensagemErro = "Não foi possível obter sua localização. ";
                if (error.code === error.PERMISSION_DENIED) {
                    mensagemErro += "Você precisa permitir o acesso à localização no navegador/celular.";
                } else {
                    mensagemErro += "Certifique-se de que o GPS está ativado. Erro: " + error.message;
                }
                alert(mensagemErro);
            }, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            });
        };

        async function calcularHorasExtras(uid) {
            try {
                const q = query(collection(db, "registros"), where("uid", "==", uid));
                const querySnapshot = await getDocs(q);

                let registros = [];
                querySnapshot.forEach((docSnap) => {
                    let reg = docSnap.data();
                    if (reg.data_hora) {
                        let dataValida = new Date(reg.data_hora);
                        if (!isNaN(dataValida.getTime())) {
                            registros.push({ ...reg, data_obj: dataValida });
                        }
                    }
                });

                registros.sort((a, b) => a.data_obj - b.data_obj);

                let totalMinutosTrabalhados = 0;
                let diasTrabalhados = new Set();
                let ultimaEntrada = null;

                registros.forEach(reg => {
                    let dataDia = reg.data_obj.toISOString().split('T')[0];

                    if (reg.tipo_batida === "Entrada") {
                        ultimaEntrada = reg.data_obj;
                    } else if (reg.tipo_batida === "Saida" && ultimaEntrada) {
                        if (reg.data_obj > ultimaEntrada) {
                            let diffMs = reg.data_obj - ultimaEntrada;
                            let diffMinutos = Math.floor(diffMs / (1000 * 60));
                            if (diffMinutos > 0 && diffMinutos < 960) {
                                totalMinutosTrabalhados += diffMinutos;
                                diasTrabalhados.add(dataDia);
                            }
                        }
                        ultimaEntrada = null;
                    }
                });

                let minutosEsperados = diasTrabalhados.size * 480;
                let minutosExtras = totalMinutosTrabalhados - minutosEsperados;
                if (minutosExtras < 0) minutosExtras = 0;

                let horasExtrasFormatadas = (minutosExtras / 60).toFixed(2);

                document.getElementById('status-horas-extras').innerHTML = `
                    Dias trabalhados: <b>${diasTrabalhados.size}</b><br>
                    Total Horas Extras: <b style="color: var(--success);">${horasExtrasFormatadas} hrs</b>
                `;

                let horasNormais = Math.max(0, (totalMinutosTrabalhados - minutosExtras) / 60).toFixed(2);

                const ctx = document.getElementById('graficoHoras').getContext('2d');
                if (meuGrafico) meuGrafico.destroy();

                meuGrafico = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Normais', 'Extras'],
                        datasets: [{
                            data: [horasNormais, horasExtrasFormatadas],
                            backgroundColor: ['#4f46e5', '#10b981'],
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { boxWidth: 12, font: { size: 11 } }
                            }
                        }
                    }
                });
            } catch (err) {
                console.error(err);
                document.getElementById('status-horas-extras').innerText = "Erro ao calcular horas.";
            }
        }
    </script>
</body>
</html>
