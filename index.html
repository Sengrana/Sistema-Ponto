<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ponto Eletrônico - Firebase</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        .resumo { font-size: 14px; color: #555; margin: 15px 0 10px 0; text-align: left; background: #f8f9fa; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="card" id="login-box">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar</button>
    </div>

    <div class="card hidden" id="ponto-box">
        <h2 id="bem-vindo" style="margin-top: 0;"></h2>
        <button onclick="baterPonto('Entrada')">Marcar Entrada</button>
        <button onclick="baterPonto('Saida')" style="background: #dc3545;">Marcar Saída</button>
        
        <div class="resumo">
            <b>Cálculo de Horas Extras:</b>
            <div id="status-horas-extras">Calculando...</div>
        </div>

        <div style="width:100%; max-width:340px; margin: auto;">
            <canvas id="graficoHoras"></canvas>
        </div>

        <button id="btn-admin" class="hidden" onclick="window.location.href='admin.html'" style="background: #28a745; margin-top: 15px;">Painel Administrador</button>
        <button onclick="fazerLogout()" style="background: #6c757d; margin-top: 8px;">Sair da Conta</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfkmIO8-XHvr49qmVZg2qUwKKGBIkNMcM",
            authDomain: "sistemaponto-f4263.firebaseapp.com",
            projectId: "sistemaponto-f4263",
            storageBucket: "sistemaponto-f4263.firebasestorage.app",
            messagingSenderId: "705613037858",
            appId: "1:705613037858:web:8c364ffcfb05074596257b",
            measurementId: "G-GRL6HE1KZM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let dadosUsuarioLogado = null;
        let meuGrafico = null;

        // Monitora automaticamente se o usuário já está logado (evita pedir login ao voltar do admin)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    dadosUsuarioLogado = docSnap.data();
                    document.getElementById('login-box').classList.add('hidden');
                    document.getElementById('ponto-box').classList.remove('hidden');
                    document.getElementById('bem-vindo').innerText = `Olá, ${dadosUsuarioLogado.nome}`;

                    const tipoUsuario = String(dadosUsuarioLogado.tipo).trim().toLowerCase();
                    if (tipoUsuario === 'admin') {
                        document.getElementById('btn-admin').classList.remove('hidden');
                    } else {
                        document.getElementById('btn-admin').classList.add('hidden');
                    }

                    calcularHorasExtras(user.uid);
                }
            }
        });

        window.fazerLogin = async function() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                await signInWithEmailAndPassword(auth, email, senha);
                // O onAuthStateChanged vai capturar o login e abrir o painel automaticamente
            } catch (error) {
                alert("Erro no login: E-mail ou senha incorretos.");
            }
        };

        window.fazerLogout = async function() {
            await signOut(auth);
            document.getElementById('ponto-box').classList.add('hidden');
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('senha').value = '';
        };

        window.baterPonto = async function(tipo) {
            if (!dadosUsuarioLogado) return;

            try {
                await addDoc(collection(db, "registros"), {
                    uid: auth.currentUser.uid,
                    nome: dadosUsuarioLogado.nome,
                    email: dadosUsuarioLogado.email,
                    tipo_batida: tipo,
                    data_hora: new Date().toISOString()
                });
                alert(`Ponto de ${tipo} registrado com sucesso!`);
                calcularHorasExtras(auth.currentUser.uid);
            } catch (error) {
                alert("Erro ao registrar ponto: " + error.message);
            }
        };

        async function calcularHorasExtras(uid) {
            try {
                const q = query(collection(db, "registros"), where("uid", "==", uid));
                const querySnapshot = await getDocs(q);

                let registros = [];
                querySnapshot.forEach((docSnap) => {
                    let reg = docSnap.data();
                    // Proteção: ignora registros antigos que estejam sem formato ISO válido
                    let dataValida = new Date(reg.data_hora);
                    if (!isNaN(dataValida)) {
                        registros.push({ ...reg, data_obj: dataValida });
                    }
                });

                // Ordena os registros cronologicamente
                registros.sort((a, b) => a.data_obj - b.data_obj);

                let totalMinutosTrabalhados = 0;
                let diasTrabalhados = new Set();
                let ultimaEntrada = null;

                registros.forEach(reg => {
                    let dataDia = reg.data_obj.toISOString().split('T')[0];

                    if (reg.tipo_batida === "Entrada") {
                        ultimaEntrada = reg.data_obj;
                    } else if (reg.tipo_batida === "Saida" && ultimaEntrada) {
                        let diffMs = reg.data_obj - ultimaEntrada;
                        let diffMinutos = Math.floor(diffMs / (1000 * 60));
                        if (diffMinutos > 0) {
                            totalMinutosTrabalhados += diffMinutos;
                            diasTrabalhados.add(dataDia);
                        }
                        ultimaEntrada = null;
                    }
                });

                let minutosEsperados = diasTrabalhados.size * 480; // 8 horas diárias
                let minutosExtras = totalMinutosTrabalhados - minutosEsperados;
                if (minutosExtras < 0) minutosExtras = 0;

                let horasExtrasFormatadas = (minutosExtras / 60).toFixed(2);

                document.getElementById('status-horas-extras').innerHTML = `
                    Dias trabalhados: <b>${diasTrabalhados.size}</b><br>
                    Total Horas Extras: <b style="color: #28a745;">${horasExtrasFormatadas} hrs</b>
                `;

                let horasNormais = Math.max(0, (totalMinutosTrabalhados - minutosExtras) / 60).toFixed(2);

                const ctx = document.getElementById('graficoHoras').getContext('2d');
                if (meuGrafico) meuGrafico.destroy();

                meuGrafico = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Horas Normais', 'Horas Extras'],
                        datasets: [{
                            label: 'Acumulado (Horas)',
                            data: [horasNormais, horasExtrasFormatadas],
                            backgroundColor: ['#007BFF', '#28a745'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            } catch (err) {
                document.getElementById('status-horas-extras').innerText = "Erro ao calcular horas.";
            }
        }
    </script>
</body>
</html>
