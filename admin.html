<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e9ecef; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h1, h2 { color: #333; }
        button { padding: 10px 15px; margin: 10px 0; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-ponto { background-color: #28a745; color: white; width: 100%; font-size: 16px; padding: 15px; margin-bottom: 20px; }
        .btn-ponto:hover { background-color: #218838; }
        .btn-sair { background-color: #dc3545; color: white; float: right; }
        .btn-sair:hover { background-color: #c82333; }
        .relatorio { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .relatorio th, .relatorio td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        .relatorio th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <button id="btn-sair" class="btn-sair">Sair do Sistema</button>
    <h1>Painel do Administrador</h1>
    
    <!-- Botão para o Admin poder bater o próprio ponto -->
    <button id="btn-ir-ponto" class="btn-ponto">Bater Meu Próprio Ponto</button>

    <h2>Relatório Geral de Pontos</h2>
    <table class="relatorio">
        <thead>
            <tr>
                <th>Funcionário (UID)</th>
                <th>Tipo</th>
                <th>Data e Hora</th>
            </tr>
        </thead>
        <tbody id="tabela-registros">
            <tr><td colspan="3">Carregando registros...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, orderBy, query, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // COLOQUE SUAS CHAVES DO FIREBASE AQUI
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_DOMINIO.firebaseapp.com",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_BUCKET",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Validação de segurança: apenas admin acessa esta tela
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const docRef = doc(db, "usuarios", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const dados = docSnap.data();
                if (dados.tipo !== 'admin') {
                    // Se não for admin, manda pra tela de funcionário
                    window.location.href = "dashboard.html";
                } else {
                    carregarTodosRegistros();
                }
            } else {
                alert("Usuário não encontrado.");
                signOut(auth).then(() => window.location.href = "index.html");
            }
        } else {
            window.location.href = "index.html";
        }
    });

    // Ação de ir para tela de bater ponto
    document.getElementById('btn-ir-ponto').addEventListener('click', () => {
        window.location.href = 'dashboard.html';
    });

    // Função para carregar relatórios gerais (últimos 50 pontos batidos)
    async function carregarTodosRegistros() {
        const q = query(collection(db, "registros"), orderBy("data_hora", "desc"), limit(50));
        const querySnapshot = await getDocs(q);
        const tabela = document.getElementById('tabela-registros');
        tabela.innerHTML = '';

        if (querySnapshot.empty) {
            tabela.innerHTML = '<tr><td colspan="3">Nenhum registro encontrado.</td></tr>';
            return;
        }

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            const dataFormatada = new Date(data.data_hora).toLocaleString('pt-BR');
            tabela.innerHTML += `
                <tr>
                    <td>${data.uid}</td>
                    <td>${data.tipo_batida}</td>
                    <td>${dataFormatada}</td>
                </tr>
            `;
        });
    }

    // Botão de Sair
    document.getElementById('btn-sair').addEventListener('click', () => {
        signOut(auth).then(() => {
            window.location.href = "index.html";
        });
    });
</script>
</body>
</html>
