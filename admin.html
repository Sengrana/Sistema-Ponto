<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        h2, h3 {
            margin-top: 0;
            color: var(--text);
            font-size: 1.25rem;
        }

        h2 { text-align: center; font-size: 1.5rem; }

        input, select, button {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button {
            background: var(--success);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--success-hover); }
        button:active { transform: scale(0.98); }

        .voltar { background: #6c757d; }
        .voltar:hover { background: #5a6268; }

        .relatorio {
            text-align: left;
            margin-top: 10px;
            max-height: 160px;
            overflow-y: auto;
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #e5e7eb;
        }

        hr {
            border: 0;
            border-top: 1px solid #e5e7eb;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Painel do Administrador</h2>
        
        <hr>
        
        <h3>Cadastrar Funcionário</h3>
        <input type="text" id="nome" placeholder="Nome Completo" autocomplete="off">
        <input type="email" id="email" placeholder="E-mail profissional" autocomplete="off">
        <input type="password" id="senha" placeholder="Senha temporária" autocomplete="new-password">
        <select id="tipo">
            <option value="funcionario">Funcionário</option>
            <option value="admin">Administrador</option>
        </select>
        <button onclick="cadastrarFuncionario()">Cadastrar</button>

        <hr>

        <h3>Consultar Histórico</h3>
        <select id="select-funcionario" onchange="carregarDadosFuncionarioAdmin()">
            <option value="">Selecione um funcionário...</option>
        </select>

        <div class="relatorio" id="resultado-admin">
            Selecione um funcionário acima para ver os registros.
        </div>

        <button class="voltar" onclick="window.location.href='index.html'" style="margin-top: 15px;">Voltar ao Início</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfkmIO8-XHvr49qmVZg2qUwKKGBIkNMcM",
            authDomain: "sistemaponto-f4263.firebaseapp.com",
            projectId: "sistemaponto-f4263",
            storageBucket: "sistemaponto-f4263.firebasestorage.app",
            messagingSenderId: "705613037858",
            appId: "1:705613037858:web:8c364ffcfb05074596257b",
            measurementId: "G-GRL6HE1KZM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.cadastrarFuncionario = async function() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const tipo = document.getElementById('tipo').value;

            if (!nome || !email || !senha) {
                alert("Preencha todos os campos!");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                const user = userCredential.user;

                await setDoc(doc(db, "usuarios", user.uid), {
                    nome: nome,
                    email: email,
                    tipo: tipo
                });

                alert("Funcionário cadastrado com sucesso!");
                document.getElementById('nome').value = '';
                document.getElementById('email').value = '';
                document.getElementById('senha').value = '';
                carregarListaFuncionarios();
            } catch (error) {
                alert("Erro ao cadastrar: " + error.message);
            }
        };

        async function carregarListaFuncionarios() {
            const querySnapshot = await getDocs(collection(db, "usuarios"));
            const select = document.getElementById('select-funcionario');
            select.innerHTML = '<option value="">Selecione um funcionário...</option>';
            
            querySnapshot.forEach((docSnap) => {
                const user = docSnap.data();
                const opt = document.createElement('option');
                opt.value = docSnap.id;
                opt.innerText = `${user.nome} (${user.tipo})`;
                select.appendChild(opt);
            });
        }

        window.carregarDadosFuncionarioAdmin = async function() {
            const uidSelecionado = document.getElementById('select-funcionario').value;
            const container = document.getElementById('resultado-admin');
            
            if (!uidSelecionado) {
                container.innerHTML = "Selecione um funcionário...";
                return;
            }

            container.innerHTML = "Carregando registros...";

            const q = query(collection(db, "registros"), where("uid", "==", uidSelecionado));
            const querySnapshot = await getDocs(q);

            let html = "<ul style='padding-left: 15px; margin: 0;'>";
            if (querySnapshot.empty) {
                html = "Nenhum registro de ponto encontrado.";
            } else {
                querySnapshot.forEach((doc) => {
                    const reg = doc.data();
                    let dataFormatada = new Date(reg.data_hora).toLocaleString("pt-BR");
                    html += `<li><b>${reg.tipo_batida}:</b> ${dataFormatada}</li>`;
                });
                html += "</ul>";
            }
            container.innerHTML = html;
        };

        carregarListaFuncionarios();
    </script>
</body>
</html>
